name: 🚀 Auto Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests (emergency deploy)'
        required: false
        default: 'false'

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  NODE_VERSION: '20.x'
  # Global placeholders for Zod validation in lib/env.ts
  NEXT_PUBLIC_SUPABASE_PWA4_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_PWA4_URL || 'https://placeholder.supabase.co' }}
  NEXT_PUBLIC_SUPABASE_PWA4_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PWA4_ANON_KEY || 'eyJplaceholder' }}
  SUPABASE_PWA4_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_PWA4_SERVICE_ROLE_KEY || 'placeholder' }}
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY || 'pk_test_placeholder' }}
  STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY || 'sk_test_placeholder' }}
  NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://airbear.me' }}

jobs:
  # Validate Environment Variables
  validate-env:
    name: ✅ Validate Environment Variables
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate environment variables
        run: pnpm run validate:env

      - name: Check Supabase configuration
        run: pnpm run check:supabase

  # Run Tests
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    needs: validate-env
    if: github.event.inputs.skip_tests != 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type check
        run: pnpm run type-check

      - name: Run linting
        run: pnpm run lint
        continue-on-error: true

      - name: Run unit tests
        run: pnpm run test:unit
        continue-on-error: true

      - name: Test database connectivity
        run: pnpm run test:database
        continue-on-error: true

      - name: Test Stripe configuration
        run: pnpm run test:stripe
        continue-on-error: true

  # Build Application
  build:
    name: 🔨 Build Application
    runs-on: ubuntu-latest
    needs: [validate-env, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        env:
          NODE_ENV: production
        run: pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: .next
          retention-days: 1

  # Deploy to Vercel
  deploy:
    name: 🚀 Deploy to Vercel
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://airbear.me
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install Vercel CLI
        run: pnpm install --global vercel@latest

      - name: Pull Vercel Environment Information
        id: vercel-env
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--yes'

      - name: Deploy to Vercel Production
        id: vercel-deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod --yes'
          scope: ${{ secrets.VERCEL_ORG_ID }}

      - name: Get deployment URL
        run: |
          echo "Deployment URL: ${{ steps.vercel-deploy.outputs.preview-url }}"
          echo "Production URL: https://airbear.me"

  # Verify Deployment
  verify:
    name: ✅ Verify Deployment
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Wait for deployment
        run: sleep 30

      - name: Check production site
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://airbear.me)
          if [ "$response" -eq 200 ]; then
            echo "✅ Production site is live!"
          else
            echo "⚠️ Production site returned status code: $response"
            exit 1
          fi

      - name: Check health endpoint
        run: |
          response=$(curl -s https://airbear.me/api/health)
          echo "Health check response: $response"
          if echo "$response" | grep -q '"status":"healthy"'; then
            echo "✅ Health endpoint is healthy!"
          else
            echo "⚠️ Health endpoint may have issues"
          fi

      - name: Verify UI loads
        run: |
          # Check if main CSS is loading
          css_response=$(curl -s -o /dev/null -w "%{http_code}" https://airbear.me/_next/static/css/app/layout.css || echo "000")
          if [ "$css_response" -eq 200 ] || [ "$css_response" -eq 000 ]; then
            echo "✅ CSS files are accessible"
          else
            echo "⚠️ CSS may not be loading correctly"
          fi

  # Sync Secrets to Vercel
  sync-secrets:
    name: 🔐 Sync Secrets to Vercel
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Install Vercel CLI
        run: pnpm install --global vercel@latest

      - name: Sync environment variables to Vercel
        run: |
          vercel env add NEXT_PUBLIC_SUPABASE_PWA4_URL production <<< "${{ secrets.NEXT_PUBLIC_SUPABASE_PWA4_URL }}" || echo "Variable may already exist"
          vercel env add NEXT_PUBLIC_SUPABASE_PWA4_ANON_KEY production <<< "${{ secrets.NEXT_PUBLIC_SUPABASE_PWA4_ANON_KEY }}" || echo "Variable may already exist"
          vercel env add SUPABASE_PWA4_SERVICE_ROLE_KEY production <<< "${{ secrets.SUPABASE_PWA4_SERVICE_ROLE_KEY }}" || echo "Variable may already exist"
          vercel env add NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY production <<< "${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}" || echo "Variable may already exist"
          vercel env add STRIPE_SECRET_KEY production <<< "${{ secrets.STRIPE_SECRET_KEY }}" || echo "Variable may already exist"
          vercel env add STRIPE_WEBHOOK_SECRET production <<< "${{ secrets.STRIPE_WEBHOOK_SECRET }}" || echo "Variable may already exist"
          vercel env add NEXT_PUBLIC_SITE_URL production <<< "${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://airbear.me' }}" || echo "Variable may already exist"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # Notify on completion
  notify:
    name: 📢 Deployment Complete
    runs-on: ubuntu-latest
    needs: [deploy, verify, sync-secrets]
    if: always()
    steps:
      - name: Deployment summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Status**: Deployment completed" >> $GITHUB_STEP_SUMMARY
          echo "🌐 **Production URL**: https://airbear.me" >> $GITHUB_STEP_SUMMARY
          echo "📅 **Deployed at**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### What was deployed:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ UI/UX with all special effects" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Map component with Leaflet" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ OAuth authentication (Google/Apple)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Dark mode (permanently enabled)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ All animations and effects" >> $GITHUB_STEP_SUMMARY
