name: 🎨 Validate UI/UX & Special Effects

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'
  NEXT_PUBLIC_SUPABASE_PWA4_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_PWA4_URL || 'https://placeholder.supabase.co' }}
  NEXT_PUBLIC_SUPABASE_PWA4_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PWA4_ANON_KEY || 'eyJplaceholder' }}
  SUPABASE_PWA4_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_PWA4_SERVICE_ROLE_KEY || 'placeholder' }}
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY || 'pk_test_placeholder' }}
  STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY || 'sk_test_placeholder' }}
  NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://airbear.me' }}

jobs:
  validate-ui:
    name: ✅ Validate UI/UX Effects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run validate:ui || exit 1

      - name: Check CSS animations exist
        run: |
          echo "Checking for CSS animation keyframes..."
          if grep -q "@keyframes pulse-glow" app/globals.css; then
            echo "✅ pulse-glow animation found"
          else
            echo "❌ pulse-glow animation missing"
            exit 1
          fi
          
          if grep -q "@keyframes float" app/globals.css; then
            echo "✅ float animation found"
          else
            echo "❌ float animation missing"
            exit 1
          fi
          
      - name: Check special effects classes
        run: |
          echo "Checking for special effect classes..."
          required_classes=(
            "hover-lift"
            "glass-morphism"
            "animate-pulse-glow"
            "animate-float"
            "airbear-holographic"
            "airbear-plasma"
          )
          
          for class in "${required_classes[@]}"; do
            if grep -q "$class" app/globals.css || grep -q "$class" tailwind.config.ts; then
              echo "✅ $class found"
            else
              echo "⚠️  $class not found (may be in components)"
            fi
          done

      - name: Validate map component
        run: |
          echo "Checking map component..."
          if [ -f "components/map-view-beautiful.tsx" ]; then
            echo "✅ Map component exists"
          else
            echo "❌ Map component missing"
            exit 1
          fi
