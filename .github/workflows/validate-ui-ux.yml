name: 🎨 Validate UI/UX & Special Effects

on:
  pull_request:
    branches: [main]  push:
    branches: [main]  workflow_dispatch:

env:  NODE_VERSION: '20.x'

jobs:
  validate-ui:
    name: ✅ Validate UI/UX Effects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate Core UI Foundation
        run: |
          echo "🎨 Validating Core UI/UX Foundation..."
          pnpm run validate:ui || exit 1
      - name: Check CSS animations exist
        run: |
          echo "Checking for CSS animation keyframes..."
          if grep -q "@keyframes pulse-glow" app/globals.css; then
            echo "✅ pulse-glow animation found"
          else
            echo "❌ pulse-glow animation missing"
            exit 1
          fi
          
          if grep -q "@keyframes float" app/globals.css; then
            echo "✅ float animation found"
          else
            echo "❌ float animation missing"
            exit 1
          fi
          
          if grep -q "animate-pulse-glow" app/globals.css; then
            echo "✅ animate-pulse-glow utility found"
          else
            echo "❌ animate-pulse-glow utility missing"
            exit 1
          fi
          
          if grep -q "animate-float" app/globals.css; then
            echo "✅ animate-float utility found"
          else
            echo "❌ animate-float utility missing"
            exit 1
          fi
      - name: Check special effects classes
        run: |
          echo "Checking for special effect classes..."
          required_classes=(
            "hover-lift"
            "glass-morphism"
            "animate-pulse-glow"
            "animate-float"
            "airbear-holographic"
            "airbear-plasma"
          )
          
          for class in "${required_classes[@]}"; do
            if grep -q "$class" app/globals.css || grep -q "$class" tailwind.config.ts; then
              echo "✅ $class found"
            else
              echo "⚠️  $class not found (may be in components)"
            fi
          done
      - name: Validate map component
        run: |
          echo "Checking map component..."
          if [ -f "components/map-view-beautiful.tsx" ]; then
            echo "✅ Map component exists"
          else
            echo "❌ Map component missing"
            exit 1
          fi
          
          if grep -q "leaflet" components/map-view-beautiful.tsx; then
            echo "✅ Leaflet integration found"
          else
            echo "⚠️  Leaflet integration may be missing"
          fi
      - name: Check dark mode configuration
        run: |
          echo "Checking dark mode configuration..."
          if grep -q 'defaultTheme="dark"' app/layout.tsx; then
            echo "✅ Dark mode permanently enabled"
          else
            echo "❌ Dark mode not configured"
            exit 1
          fi
          
          if grep -q 'enableSystem={false}' app/layout.tsx; then
            echo "✅ System theme detection disabled"
          else
            echo "⚠️  System theme detection may be enabled"
          fi
      - name: Validate mascot presence
        run: |
          echo "Checking AirBear mascot..."
          if [ -f "public/airbear-mascot.png" ]; then
            echo "✅ Mascot image exists"
          else
            echo "⚠️  Mascot image may be missing"
          fi
          
          # Check if mascot is used in key pages
          pages_with_mascot=0
          for file in app/page.tsx app/map/page.tsx app/auth/login/page.tsx app/auth/signup/page.tsx; do
            if [ -f "$file" ] && grep -q "airbear-mascot" "$file"; then
              pages_with_mascot=$((pages_with_mascot + 1))
            fi
          done
          echo "✅ Mascot found in $pages_with_mascot key pages"
      - name: Summary
        run: |
          echo "## 🎨 UI/UX Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **CSS Animations**: Validated" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Special Effects**: Validated" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Map Component**: Validated" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Dark Mode**: Validated" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Mascot**: Validated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All UI/UX components are properly configured!" >> $GITHUB_STEP_SUMMARY